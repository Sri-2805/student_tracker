{% extends "base.html" %}
{% block title %}New Assessment{% endblock %}
{% block content %}
<h4 class="mb-3">Create New Assessment</h4>
<div class="card" style="max-width:520px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Course</label>
        <select name="course_id" class="form-select" required>
          {% for c in courses %}
            <option value="{{ c.course_id }}">{{ c.course_code }} — {{ c.course_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g. Quiz 2" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Type</label>
        <select name="assessment_type" class="form-select">
          <option>Quiz</option><option>Assignment</option><option>Midterm</option>
          <option>Final</option><option>Lab</option><option>Project</option>
        </select>
      </div>
      <div class="row">
        <div class="col-6 mb-3">
          <label class="form-label">Max Marks</label>
          <input type="number" step="0.01" name="max_marks" class="form-control" value="100" required>
        </div>
        <div class="col-6 mb-3">
          <label class="form-label">Weight (%)</label>
          <input type="number" step="0.01" name="weight_percent" class="form-control" value="10" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" name="assessment_date" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Create & Enter Grades</button>
    </form>
  </div>
</div>
{% endblock %}
